pool: AXIS-SBX-POOL

stages:

- stage:
  displayName: tera_init

  jobs:
  - job: terraforminit
    displayName: tera_init

    steps:
    - task: TerraformInstaller@1
      inputs:
        terraformVersion: 'latest'

    - script: |
        echo "System.DefaultWorkingDirectory = $(System.DefaultWorkingDirectory)"
        echo "PWD = $(pwd)"
        echo "Contents:"
        ls -la $(System.DefaultWorkingDirectory)
        echo "Repo directory:"
        ls -ld $(System.DefaultWorkingDirectory)/axis-sbx-poc-devops
      displayName: Check Working Directory    

    - task: TerraformTask@5
      inputs:
        provider: 'azurerm'
        command: 'init'
        workingDirectory: '$(System.DefaultWorkingDirectory)/axis-sbx-poc-devops'
        backendServiceArm: 'axis-terraform-connection'
        backendAzureRmResourceGroupName: 'axis-sbx-poc-rg'
        backendAzureRmStorageAccountName: 'axis sbxpocst01'
        backendAzureRmContainerName: 'axispoctfstate'
        backendAzureRmKey: 'poc.tfstate'


- stage:
  displayName: tera_validate

  jobs:
  - job: terraformvalidate
    displayName: tera_validate

    steps:
    - task: TerraformTask@5
      inputs:
        provider: 'azurerm'
        command: 'init'
        workingDirectory: '$(System.DefaultWorkingDirectory)/axis-sbx-poc-devops'
        backendServiceArm: 'axis-terraform-connection'
        backendAzureRmResourceGroupName: 'axis-sbx-poc-rg'
        backendAzureRmStorageAccountName: 'axis sbxpocst01'
        backendAzureRmContainerName: 'axispoctfstate'
        backendAzureRmKey: 'poc.tfstate'

    - task: TerraformTask@5
      inputs:
        provider: 'azurerm'
        command: 'validate'
        workingDirectory: '$(System.DefaultWorkingDirectory)/axis-sbx-poc-devops'


- stage:
  displayName: tera_plan

  jobs:
  - job: terraformplan
    displayName: tera_plan

    steps:
    - task: TerraformTask@5
      inputs:
        provider: 'azurerm'
        command: 'init'
        workingDirectory: '$(System.DefaultWorkingDirectory)/axis-sbx-poc-devops'
        backendServiceArm: 'axis-terraform-connection'
        backendAzureRmResourceGroupName: 'axis-sbx-poc-rg'
        backendAzureRmStorageAccountName: 'axis sbxpocst01'
        backendAzureRmContainerName: 'axispoctfstate'
        backendAzureRmKey: 'poc.tfstate'

    - task: TerraformTask@5
      inputs:
        provider: 'azurerm'
        command: 'plan'
        workingDirectory: '$(System.DefaultWorkingDirectory)/axis-sbx-poc-devops'
        environmentServiceNameAzureRM: 'axis-terraform-connection'